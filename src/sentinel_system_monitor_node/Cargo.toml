# Phase 14.4b — declarative wrapper (/system/system_monitor): the Linux-only
# monitoring/diagnostic stub publishers (Phase 12 parity surface).

[package]
name = "sentinel_system_monitor_node"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[package.metadata.nros.node]
class = "sentinel_system_monitor_node::SystemMonitorNode"
name = "system_monitor"
default_namespace = "/system"

[dependencies]
nros = { version = "*", default-features = false, features = [
    "alloc",
    "rmw-cffi",
    "ros-humble",
] }
autoware_sentinel_core = { path = "../autoware_sentinel_core" }
nros-log = { version = "*", default-features = false }
autoware_adapi_v1_msgs = { version = "*", default-features = false }
autoware_system_msgs = { version = "*", default-features = false }
diagnostic_msgs = { version = "*", default-features = false }
builtin_interfaces = { version = "*", default-features = false }
std_msgs = { version = "*", default-features = false }
tier4_system_msgs = { version = "*", default-features = false }
