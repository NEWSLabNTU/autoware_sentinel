# RMW overlay: zenoh-pico backend.

CONFIG_NROS_RMW_ZENOH=y

# Zenoh-pico uses TCP to reach zenohd.
CONFIG_NET_TCP=y

# zenoh-pico thread + mutex requirements.
CONFIG_POSIX_API=y
# Phase 14.5: both failing runs died at exactly the 28th declare — the
# pthread mutex pool (32) minus session/task mutexes. Each declared entity
# takes one; nano-ros hit the same class upstream (wall #9, cyclone).
CONFIG_MAX_PTHREAD_MUTEX_COUNT=256
CONFIG_MAX_PTHREAD_COND_COUNT=128
CONFIG_POSIX_THREAD_THREADS_MAX=16

# Resource sizing. The params entry allocates MORE than the base pub/sub
# entry: `apply_param_services` (#128 emit) builds the volatile param store +
# the six ROS 2 parameter services — one ~75 KiB Rust heap allocation
# ("memory allocation of 75080 bytes failed" on the base sizing). The Rust
# global allocator (zephyr-lang-rust) wraps **libc malloc** — picolibc's
# arena, sized by CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE (default 16 KiB) —
# NOT the kernel heap, so THAT is the load-bearing knob. 256 KiB for both
# (native_sim runs on host RAM; the cost is irrelevant).
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=8388608
# Phase 14.5 — the 10-node graph's executor arena (48 cbs) + zenoh session
# needs a bigger picolibc arena than the single-node examples: the Rust
# global allocator wraps libc malloc, and a 1.16 MB request failed at 1 MiB.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8388608
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Phase 14.5 — native_sim networking WITHOUT root: NSOS (native offloaded
# sockets) hands zenoh-pico the HOST's BSD sockets instead of the zeth TAP
# interface that `net-setup.sh` must create as root. native_sim-only; real
# boards keep their own net stack. (Board overlay is not auto-applied under
# an explicit CONF_FILE, hence the explicit rows.)
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

CONFIG_NET_SHELL=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_DEBUG=y

# phase-276 W2 — the 100 Hz ctrl tier needs > 100 tx windows/s: Zephyr zsock
# serializes send behind the read task's recv window, so the window must be
# far shorter than the fastest publish period (issues 0129/0139).
# Phase 14.5: the RT example uses 5 ms for 100 Hz publishing; a 38-declare
# registration burst needs a real window (declare sends returned -1).
CONFIG_NROS_ZENOH_SOCKET_TIMEOUT_MS=200

# Locator: Kconfig -> NROS_LOCATOR bake (nros-zephyr-build). NSOS means the
# guest uses HOST sockets, so plain loopback reaches the host zenohd.
CONFIG_NROS_ZENOH_LOCATOR="tcp/127.0.0.1:7447"

# Phase 14.5 — zenoh shim slot caps for the 10-node graph. Zephyr takes
# these from Kconfig (the freertos/nuttx lanes use the ZPICO_* build envs):
# defaults are 8/8/8/16, and the gate node ALONE declares 17 publishers —
# the overflow hung the register pass silently instead of erroring.
CONFIG_NROS_MAX_PUBLISHERS=56
CONFIG_NROS_MAX_SUBSCRIBERS=32
CONFIG_NROS_MAX_QUERYABLES=32
CONFIG_NROS_MAX_LIVELINESS=160
# The 10-node graph declares ~50 entities back-to-back; the default
# unicast batch is too small for the longest keyexpr declares (the
# is_filter_activated/marker publisher failed z_declare_publisher -1).
CONFIG_NROS_BATCH_UNICAST_SIZE=8192
CONFIG_NROS_FRAG_MAX_SIZE=16384
