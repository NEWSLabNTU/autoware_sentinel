# Autoware Sentinel — FreeRTOS Cargo configuration
#
# This crate is excluded from the main workspace (cross-target build), so it
# needs its own [patch.crates-io] entries. nros crates point at the local
# nano-ros checkout; generated message crates re-use sentinel_linux/generated/
# (single source of truth for the msg superset).

[build]
target = "thumbv7m-none-eabi"

[target.thumbv7m-none-eabi]
runner = "qemu-system-arm -cpu cortex-m3 -machine mps2-an385 -nographic -semihosting-config enable=on,target=native -kernel"
rustflags = [
    "-C", "link-arg=-Tmps2_an385.ld",
    "-C", "link-arg=--nmagic",
]

# --- nros crates (local path matches workspace git pin content) -------------

[patch.crates-io.nros]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "036057ff"

[patch.crates-io.nros-core]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "036057ff"

[patch.crates-io.nros-serdes]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "036057ff"

[patch.crates-io.nros-node]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "036057ff"

[patch.crates-io.nros-rmw]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "036057ff"

[patch.crates-io.nros-params]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "036057ff"

[patch.crates-io.nros-macros]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "036057ff"

[patch.crates-io.nros-rmw-zenoh]
