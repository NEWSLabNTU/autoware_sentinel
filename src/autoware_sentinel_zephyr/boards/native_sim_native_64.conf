# Board overlay for native_sim (64-bit)
#
# Uses NSOS (Native Simulator Offloaded Sockets) — zenoh-pico's TCP socket
# calls hit the host's BSD socket API directly, so no TAP/bridge setup is
# needed. Connect to host's zenohd at 127.0.0.1:7447.
CONFIG_ETH_NATIVE_POSIX=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
# Run as fast as the host CPU allows (no simulated-time slowdown). Helps the
# zenoh-pico read thread keep up with the bringup-time declare burst.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n

# Route UART 0 to stdin/stdout instead of a per-instance pseudoterminal.
# Default `NATIVE_UART_0_ON_OWN_PTY` opens `/dev/pts/<n>` for printk, and
# when no host process attaches as a reader the kernel pipe fills after a
# few KB — Zephyr's printk then blocks inside zenoh-pico's
# `z_declare_publisher` and the call returns `_Z_ERR_GENERIC (-128)`,
# wrecking suite-level test runs that share the binary across multiple
# nextest test processes. Routing to stdout lets `ManagedProcess`'s
# captured pipe drain the output continuously.
CONFIG_NATIVE_UART_0_ON_STDINOUT=y

# Debug settings for development
CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_SHELL=y
CONFIG_DEBUG=y
CONFIG_DEBUG_INFO=y
