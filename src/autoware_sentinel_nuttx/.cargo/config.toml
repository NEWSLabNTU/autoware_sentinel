# Autoware Sentinel — NuttX Cargo configuration
#
# This crate is excluded from the main workspace (cross-target build), so it
# needs its own [patch.crates-io] entries. nros crates are pinned to the
# upstream commit that includes Phase 13.K1's xTaskCreate cast fix; flip
# them to the local sibling clone (`../../../nano-ros-sentinel/...`) when
# investigating against unpushed firmware patches.

[build]
target = "armv7a-nuttx-eabihf"

[unstable]
# NuttX is Tier 3; build std + panic_abort from source. Requires nightly
# (rust-toolchain.toml in this directory pins it).
build-std = ["std", "panic_abort"]
build-std-features = ["compiler-builtins-mem"]

[target.armv7a-nuttx-eabihf]
linker = "arm-none-eabi-gcc"
rustflags = [
    "-C", "link-arg=-mcpu=cortex-a7",
    "-C", "link-arg=-mfloat-abi=hard",
    "-C", "link-arg=-mfpu=neon-vfpv4",
]

[env]
CC_armv7a_nuttx_eabihf = "arm-none-eabi-gcc"
CFLAGS_armv7a_nuttx_eabihf = "-mcpu=cortex-a7 -mfloat-abi=hard -mfpu=neon-vfpv4"

# --- nros crates (resolved by [patch.crates-io] from the GitHub commit) -----

[patch.crates-io.nros]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "020af3d5"

[patch.crates-io.nros-core]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "020af3d5"

[patch.crates-io.nros-serdes]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "020af3d5"

[patch.crates-io.nros-node]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "020af3d5"

[patch.crates-io.nros-rmw]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "020af3d5"

[patch.crates-io.nros-params]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "020af3d5"

[patch.crates-io.nros-macros]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "020af3d5"

[patch.crates-io.nros-rmw-zenoh]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "020af3d5"

[patch.crates-io.zpico-sys]
git = "https://github.com/NEWSLabNTU/nano-ros.git"
rev = "020af3d5"

# Patched libc with NuttX's _SC_HOST_NAME_MAX (used by build-std).
# Cargo's git source resolves the root crate only, so the patch must
# come from a path. Points at the sibling clone; install nano-ros-sentinel
# (or set NUTTX_LIBC_PATH and adjust this entry) before building.
[patch.crates-io.libc]
path = "../../../nano-ros-sentinel/third-party/nuttx/libc"

