# Autoware Sentinel — NuttX Cargo configuration
#
# Excluded from the main workspace (cross-target build) so it carries its
# own [patch.crates-io]. Phase 14.1: nros crates patch to the local
# nano-ros checkout (pin baseline 21a3a4248); message crates point at the
# root generated/ tree (run `nros sync` at the repo root first).

[build]
target = "armv7a-nuttx-eabihf"

[unstable]
# NuttX is Tier 3; build std + panic_abort from source. Requires nightly
# (rust-toolchain.toml in this directory pins it).
build-std = ["std", "panic_abort"]
build-std-features = ["compiler-builtins-mem"]

# #127 board-centric link convention: the board crate's build.rs propagates
# dramboot.ld, the vectortab boot archive, and the -L search dirs; the
# static image-link args live here (mirrors examples/workspaces
# .cargo/config.toml). No crate build.rs.
[target.armv7a-nuttx-eabihf]
linker = "arm-none-eabi-gcc"
rustflags = [
    "-C", "link-arg=-mcpu=cortex-a7",
    "-C", "link-arg=-mfloat-abi=hard",
    "-C", "link-arg=-mfpu=neon-vfpv4",
    "-C", "link-arg=-Tdramboot.ld",
    "-C", "link-arg=--entry=__start",
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-nodefaultlibs",
    "-C", "link-arg=-Wl,--start-group",
    "-C", "link-arg=-lsched",
    "-C", "link-arg=-ldrivers",
    "-C", "link-arg=-lboards",
    "-C", "link-arg=-lc",
    "-C", "link-arg=-lmm",
    "-C", "link-arg=-larch",
    "-C", "link-arg=-lxx",
    "-C", "link-arg=-lapps",
    "-C", "link-arg=-lnet",
    "-C", "link-arg=-lcrypto",
    "-C", "link-arg=-lfs",
    "-C", "link-arg=-lbinfmt",
    "-C", "link-arg=-lopenamp",
    "-C", "link-arg=-lboard",
    "-C", "link-arg=-lgcc",
    "-C", "link-arg=-Wl,--end-group",
]

[env]
CC_armv7a_nuttx_eabihf = "arm-none-eabi-gcc"
CFLAGS_armv7a_nuttx_eabihf = "-mcpu=cortex-a7 -mfloat-abi=hard -mfpu=neon-vfpv4"
# zpico capacity knobs (NuttX profile — see justfile nuttx_env history)
ZPICO_MAX_PUBLISHERS = "56"
ZPICO_MAX_SUBSCRIBERS = "64"
ZPICO_MAX_QUERYABLES = "32"
ZPICO_MAX_LIVELINESS = "160"

[patch.crates-io]
# nano-ros crates named by this crate's Cargo.toml.
nros = { path = "../../../nano-ros-sentinel/packages/core/nros" }
nros-platform = { path = "../../../nano-ros-sentinel/packages/core/nros-platform" }
nros-board-nuttx-qemu-arm = { path = "../../../nano-ros-sentinel/packages/boards/nros-board-nuttx-qemu-arm" }
# Patched libc with NuttX-specific symbols build-std's `std` needs.
libc = { path = "../../../nano-ros/third-party/nuttx/libc" }

# Generated message crates (root generated/ — superset for all targets).
autoware_adapi_v1_msgs = { path = "../../generated/autoware_adapi_v1_msgs" }
autoware_adapi_version_msgs = { path = "../../generated/autoware_adapi_version_msgs" }
