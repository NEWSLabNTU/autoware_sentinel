# Phase 14.4b — declarative Node-trait wrapper (/control/autoware_shift_decider).

[package]
name = "sentinel_shift_decider_node"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[package.metadata.nros.node]
class = "sentinel_shift_decider_node::ShiftDeciderNode"
name = "autoware_shift_decider"
default_namespace = "/control"

[dependencies]
nros = { version = "*", default-features = false, features = [
    "alloc",
    "rmw-cffi",
    "ros-humble",
] }
autoware_sentinel_core = { path = "../autoware_sentinel_core" }
autoware_system_msgs = { version = "*", default-features = false }
autoware_vehicle_msgs = { version = "*", default-features = false }
