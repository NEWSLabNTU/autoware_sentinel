# Autoware Sentinel — Zephyr Cargo patch configuration
#
# Zephyr is excluded from the main workspace, so it needs its own [patch.crates-io]
# entries. nros crates point at the local nano-ros checkout (matching Linux's
# build via workspace patch). Generated message crates point at sentinel_linux's
# generated/ — single source of truth for the msg superset.

# --- nros crates (local path matches workspace git pin content) -------------

[patch.crates-io.nros]
path = "../../../nano-ros/packages/core/nros"

[patch.crates-io.nros-core]
path = "../../../nano-ros/packages/core/nros-core"

[patch.crates-io.nros-serdes]
path = "../../../nano-ros/packages/core/nros-serdes"

[patch.crates-io.nros-node]
path = "../../../nano-ros/packages/core/nros-node"

[patch.crates-io.nros-rmw]
path = "../../../nano-ros/packages/core/nros-rmw"

[patch.crates-io.nros-params]
path = "../../../nano-ros/packages/core/nros-params"

[patch.crates-io.nros-macros]
path = "../../../nano-ros/packages/core/nros-macros"

[patch.crates-io.nros-rmw-zenoh]
path = "../../../nano-ros/packages/zpico/nros-rmw-zenoh"

[patch.crates-io.zpico-sys]
path = "../../../nano-ros/packages/zpico/zpico-sys"

# --- Generated message crates (shared with sentinel_linux) ------------------

