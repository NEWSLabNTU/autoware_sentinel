# QEMU MPS2-AN385 FreeRTOS — network configuration
# Used by nros-board-mps2-an385-freertos board crate (Config::from_toml)
#
# QEMU user-mode networking (SLIRP) bridges 10.0.2.0/24 to host. Host
# zenohd listens at 10.0.2.2:7451; sentinel connects from 10.0.2.20.

[network]
ip = "10.0.2.20"
mac = "02:00:00:00:00:00"
gateway = "10.0.2.2"
netmask = "255.255.255.0"

[zenoh]
locator = "tcp/10.0.2.2:7451"
domain_id = 0

# FreeRTOS scheduling (normalized 0–31, higher = more important).
# Match the talker example baseline.
[scheduling]
app_priority = 12
app_stack_bytes = 524288
zenoh_read_priority = 16
zenoh_read_stack_bytes = 8192
zenoh_lease_priority = 16
zenoh_lease_stack_bytes = 5120
poll_priority = 16
poll_interval_ms = 5
