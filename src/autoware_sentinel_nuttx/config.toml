# NuttX QEMU ARM virt — network configuration
# Used by nros-board-nuttx-qemu-arm (Config::from_toml).
#
# Phase 14.1: direct-mode [[transport]]/[node] schema (legacy
# [network]/[zenoh] dropped upstream, 172.K.6). QEMU SLIRP bridges
# 10.0.2.0/24 to the host; zenohd listens on host :7452 (kept distinct
# from the FreeRTOS sentinel's 7447/7451 lane).

[[transport]]
ip = "10.0.2.30/24"
gateway = "10.0.2.2"
locator = "tcp/10.0.2.2:7452"

[node]
domain_id = 0
