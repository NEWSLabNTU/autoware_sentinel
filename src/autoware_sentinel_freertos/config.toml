# QEMU MPS2-AN385 FreeRTOS — network configuration
# Used by nros-board-mps2-an385-freertos (Config::from_toml).
#
# Phase 14.1: rewritten to the direct-mode nros.toml schema — legacy
# [network]/[zenoh]/[scheduling] sections were dropped upstream
# (phase 172.K.6). QEMU user-mode networking (SLIRP) bridges
# 10.0.2.0/24 to the host: zenohd listens on the host at :7447,
# reachable from the guest as 10.0.2.2.

[[transport]]
ip = "10.0.2.20/24"
mac = "02:00:00:00:00:00"
gateway = "10.0.2.2"
locator = "tcp/10.0.2.2:7447"

[node]
domain_id = 0
