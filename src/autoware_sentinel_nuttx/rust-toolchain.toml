# NuttX requires `-Z build-std` to compile std from source against a
# patched libc (NuttX's `_SC_HOST_NAME_MAX` is missing from upstream
# libc < ~0.2.180). Cargo's [patch] entries only apply when the version
# matches exactly, so this nightly is pinned to the same revision the
# nano-ros NuttX examples use; track changes there in lockstep.
#
# To bump:
#   1. Pick a new nightly:  rustup toolchain install nightly-YYYY-MM-DD
#   2. Read its libc dep version from
#      ~/.rustup/toolchains/nightly-YYYY-MM-DD-.../lib/rustlib/src/rust/library/std/Cargo.toml
#   3. Update this file *and* the libc patch in nano-ros's
#      third-party/nuttx/libc/Cargo.toml.
#   4. `just build-sentinel-nuttx` and run the integration tests.
[toolchain]
channel = "nightly-2026-04-11"
components = ["rust-src", "rustfmt"]
