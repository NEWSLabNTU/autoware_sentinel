# SPE Cortex-R5F firmware build config.
#
# `armv7r-none-eabi` (NOT `eabihf`) — NVIDIA's BSP CFLAGS are
# `-mfloat-abi=softfp -mfpu=vfpv3-d16`, and the bundled newlib in
# `arm-gnu-toolchain-13.2.rel1` ships only the soft-float libc.
# Linking hardfp Rust objects against softfp BSP objects fails with
# `error: ... uses VFP register arguments, ... does not`. Using the
# soft-float Rust target sidesteps the conflict; perf hit on the
# sentinel's float-light control path is negligible (no MPC).
#
# `-Zbuild-std` is required because `armv7r-none-eabi` is a Tier-3
# target without a prebuilt `core` rlib in the rustup tree, and we
# need the same compile-time flags applied to `core` + `alloc` as to
# our own crates so panic-strategy + float-ABI propagate uniformly.

[build]
target = "armv7r-none-eabi"

[unstable]
build-std = ["core", "alloc"]

# `armv7r-none-eabi` defaults to pure soft-float (`llvm-floatabi=soft`),
# which makes rustc emit calls to `__adddf3`/`__divdf3`/`__muldf3` for
# every f64 op — ~3 KB BTCM on the Cortex-R5F just for the soft-emul
# routines that the SafetyIsland tick path drags in (PID gain math, MRM
# velocity update). Cortex-R5 ships VFPv3-D16 with double-precision
# support, and the FSP is built `-mfloat-abi=softfp -mfpu=vfpv3-d16`.
# Enabling those features here flips rustc to use the VFP coproc for
# fp ops while keeping the soft *call* ABI, which is the same softfp
# convention the FSP uses — so the resulting Rust objects link cleanly
# against `libtegra_aon_fsp.a` without the
# `error: ... uses VFP register arguments` mismatch the eabihf target
# would trigger.
[target.armv7r-none-eabi]
# `-Cpanic=immediate-abort` collapses every `panic!` into a single
# `abort` intrinsic — drops panic locations, message formatter, and
# `core::panicking::panic_fmt`. Saves ~3 KB BTCM on `core` alone
# (escape_debug_ext, PadAdapter, from_utf8 are mostly Debug/Display
# formatting reachable only from panic messages). Trade-off: panics
# no longer print location; a runtime panic looks like a halt —
# acceptable since `panic-halt` is the configured handler anyway.
rustflags = [
    "-C", "target-feature=+vfp3,+d32",
    "-Z", "unstable-options",
    "-C", "panic=immediate-abort",
]
