# nextest configuration for Autoware Sentinel
# See: https://nexte.st/book/configuration.html

[profile.default]
# Mark tests as slow after 30 seconds, terminate after 60 seconds
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

# Transport smoke tests: heavyweight (zenohd + sentinel + ROS 2 CLI),
# run sequentially to avoid port/resource contention.
[test-groups.transport-smoke]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(transport_smoke)"
test-group = "transport-smoke"
# 60s x 3: under contention individual flows reached ~120 s.
slow-timeout = { period = "60s", terminate-after = 3 }

# Planning simulator tests: very heavyweight (Autoware + sentinel + ROS 2),
# run sequentially with longer timeouts.
[test-groups.planning-simulator]
max-threads = 1

# Phase 14/15 — these boot a FULL Autoware (~150 processes) twice over and
# drive a route. Measured on a contended box (a second Autoware session
# live): baseline drive 135 s, sentinel-replacement 335 s. The old
# 120s x 2 = 240 s kill was BELOW the observed pass time — a latent flake
# that would have read as a sentinel regression. Domain isolation
# (ros2::TEST_DDS_DOMAIN) keeps the runs from colliding; this gives them
# room to be slow.
[[profile.default.overrides]]
filter = "binary(planning_simulator)"
test-group = "planning-simulator"
slow-timeout = { period = "180s", terminate-after = 4 }

# Controller node tests: heavyweight (zenohd + sentinel + multiple ROS 2 pubs),
# run sequentially to avoid resource contention.
[test-groups.controller-node]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(controller_node)"
test-group = "controller-node"
slow-timeout = { period = "60s", terminate-after = 2 }

# Zephyr native_sim tests: heavyweight (TAP networking + Zephyr + zenohd + ROS 2),
# run sequentially with longer timeouts.
[test-groups.zephyr-native-sim]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(zephyr_native_sim)"
test-group = "zephyr-native-sim"
slow-timeout = { period = "60s", terminate-after = 2 }

# Auto-drive comparison tests: very heavyweight (full Autoware stack + auto_drive.py),
# run sequentially with very long timeouts.
[test-groups.auto-drive-comparison]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(auto_drive_comparison)"
test-group = "auto-drive-comparison"
slow-timeout = { period = "300s", terminate-after = 2 }

# FreeRTOS QEMU tests: heavyweight (cross-compile + QEMU MPS2-AN385 boot,
# zenohd locked to compile-time port 7451), run sequentially.
[test-groups.freertos-qemu]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(freertos_qemu)"
test-group = "freertos-qemu"
slow-timeout = { period = "120s", terminate-after = 2 }

# NuttX QEMU tests: heavyweight (cross-compile via build-std + QEMU virt
# boot + zpico handshake, zenohd locked to compile-time port 7452), run
# sequentially.
[test-groups.nuttx-qemu]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(nuttx_qemu)"
test-group = "nuttx-qemu"
slow-timeout = { period = "180s", terminate-after = 2 }

# SPE sentinel tests (Phase 11.3.E): POSIX dev path of
# autoware_sentinel_spe — Linux process boot + topic visibility via
# zenohd. Run sequentially: shares the same comp-mrm + comp-engagement
# publisher/subscription topology and conflicts with the regular
# transport_smoke set.
[test-groups.sentinel-spe]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(sentinel_spe)"
test-group = "sentinel-spe"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = true
