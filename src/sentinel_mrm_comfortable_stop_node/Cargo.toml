# Phase 14.4b — declarative Node-trait wrapper (/system/mrm_comfortable_stop_operator).

[package]
name = "sentinel_mrm_comfortable_stop_node"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[package.metadata.nros.node]
class = "sentinel_mrm_comfortable_stop_node::ComfortableStopOperatorNode"
name = "mrm_comfortable_stop_operator"
default_namespace = "/system"

[dependencies]
nros = { version = "*", default-features = false, features = [
    "alloc",
    "rmw-cffi",
    "ros-humble",
] }
autoware_sentinel_core = { path = "../autoware_sentinel_core" }
tier4_system_msgs = { version = "*", default-features = false }
