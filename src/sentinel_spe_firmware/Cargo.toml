# Autoware Sentinel — SPE firmware wrap (Phase 11.5.b)
#
# `staticlib` wrap of nano-ros's `nros-board-orin-spe` rlib + a panic
# handler. NVIDIA's `rt-aux-cpu-demo-fsp/Makefile` links the resulting
# `libsentinel_spe_firmware.a` into `spe.elf` via the `ENABLE_NROS_APP`
# branch (see `scripts/spe/apply-patches.sh`).
#
# Excluded from the workspace because cargo can't unify the workspace's
# host target (`x86_64-unknown-linux-gnu`) with the SPE's
# `armv7r-none-eabi`. Build via:
#   `cd src/sentinel_spe_firmware && cargo +nightly build --release`
# or via `just build-spe-image` from the repo root, which orchestrates
# cargo + the BSP patch + the upstream Makefile.

[package]
name = "sentinel-spe-firmware"
version = "0.1.0"
edition = "2024"
description = "Autoware Sentinel SPE firmware (Cortex-R5F + NVIDIA FSP)"
license = "Apache-2.0"
publish = false

[lib]
name = "sentinel_spe_firmware"
crate-type = ["staticlib"]

# Workspace excluded → must declare git deps locally; the workspace's
# `[patch.crates-io]` block is invisible from here. Pin matches the
# rev in the parent workspace's Cargo.toml so a future bump touches
# both files together.
[dependencies]
log = { version = "0.4", default-features = false }

# Board crate (run<F,E>, Config, println!) from nano-ros.
nros-board-orin-spe = { git = "https://github.com/NEWSLabNTU/nano-ros.git", rev = "682f1404", default-features = false, features = ["fsp", "cortex-r"] }

# `nros-platform` is a transitive dep of the board crate; declared
# explicitly here to flip on `global-allocator` (Phase 71.27 — wires
# the FreeRTOS `pvPortMalloc` / `vPortFree` pair as Rust's
# `#[global_allocator]`). Without this, even crates that pull `alloc`
# transitively fail with "no global memory allocator found" when
# linked into a `staticlib`.
nros-platform = { git = "https://github.com/NEWSLabNTU/nano-ros.git", rev = "682f1404", default-features = false, features = ["platform-orin-spe", "global-allocator"] }

# Phase 11.3 status:
#   [x] 11.3.A — zero-copy `nvidia-ivc/fsp` API on nano-ros side.
#   [x] 11.3.B — `Z_FEATURE_MULTI_THREAD=1` + `ZENOH_ORIN_SPE`
#       platform header. `zpico_spin_once` uses the FreeRTOS
#       condvar wait path; no `select(2)` in the SPE link.
#   [~] 11.3.C — feature pruning. nros pulled with the smallest
#       feature set that still gives `Executor` + `ExecutorConfig`:
#       `rmw-zenoh,platform-orin-spe,ros-humble`. Dropped:
#       `param-services`, `lifecycle-services`, `safety-e2e`,
#       `stream`, `unstable-zenoh-api`. Watch
#       `arm-none-eabi-size build/spe.elf` after each prune; goal
#       is .text+.data+.bss < 232 KB.
#   [ ] 11.3.D — SafetyIsland wiring in lib.rs.

# nros umbrella — `Executor` / `ExecutorConfig` / `NodeError`.
nros = { git = "https://github.com/NEWSLabNTU/nano-ros.git", rev = "682f1404", default-features = false, features = ["rmw-zenoh", "platform-orin-spe", "ros-humble"] }

# Shared sentinel core — pulls all algorithm crates transitively.
# Default features only (`comp-*` off, `monitoring-topics` off):
# minimal core baseline of 6 pubs / 3 subs / 1 service / 1 timer.
# 11.3.D wires `init_island` + `wire_executor` in lib.rs.
autoware_sentinel_core = { path = "../autoware_sentinel_core", default-features = false, features = ["platform-orin-spe"] }

# `panic-halt` is the simplest correct strategy for the SPE: an
# uncaught panic blocks the FreeRTOS task forever via WFI. The MRM
# safety path is in the application closure itself, not in the
# panic handler. A future iteration may swap this for a logger that
# emits the panic location to TCU before halting.
panic-halt = "1"

# Cortex-R5F has no unwinder. Panics must abort everywhere — both this
# crate and every transitive dependency. Setting the strategy on the
# top-level profile is what makes cargo propagate it.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
opt-level = "z"      # 256 KB BTCM is tight; size before speed
codegen-units = 1
debug = false        # Strip; debug symbols inflate the rlib but are
                     # discarded by the final link anyway.

# Workspace excluded → must declare patches locally; the workspace's
# `[patch.crates-io]` block is invisible from here. Pin matches the
# rev in the parent workspace's Cargo.toml so a future bump touches
# both files together. Generated message crates re-use sentinel_linux's
# generated/ tree (single source of truth for the msg superset, same
# pattern as freertos / nuttx / zephyr siblings).
[patch.crates-io]
nros = { git = "https://github.com/NEWSLabNTU/nano-ros.git", rev = "682f1404" }
nros-core = { git = "https://github.com/NEWSLabNTU/nano-ros.git", rev = "682f1404" }
nros-serdes = { git = "https://github.com/NEWSLabNTU/nano-ros.git", rev = "682f1404" }
nros-rmw-zenoh = { git = "https://github.com/NEWSLabNTU/nano-ros.git", rev = "682f1404" }
zpico-sys = { git = "https://github.com/NEWSLabNTU/nano-ros.git", rev = "682f1404" }

autoware_adapi_v1_msgs = { path = "../autoware_sentinel_linux/generated/autoware_adapi_v1_msgs" }
autoware_adapi_version_msgs = { path = "../autoware_sentinel_linux/generated/autoware_adapi_version_msgs" }
