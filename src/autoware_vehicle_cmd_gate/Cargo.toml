[package]
name = "autoware_vehicle_cmd_gate"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
autoware_control_msgs = { version = "*", default-features = false }
autoware_vehicle_msgs = { version = "*", default-features = false }
autoware_adapi_v1_msgs = { version = "*", default-features = false }
libm = "0.2"

# Workaround: LLVM SIGSEGV in ARM register scavenger when compiling
# autoware_adapi_v1_msgs at opt-level=0 for thumbv7em-none-eabihf.
# See: https://github.com/llvm/llvm-project/issues/64277
[profile.dev.package.autoware_adapi_v1_msgs]
opt-level = 1

[features]
default = []
std = [
    "autoware_control_msgs/std",
    "autoware_vehicle_msgs/std",
    "autoware_adapi_v1_msgs/std",
]
# Replace `libm::tanf` / `libm::atanf` (lateral-acceleration limit math)
# with closed-form polynomial approximations valid over the steering
# range a passenger vehicle actually sees (|θ| ≤ ~0.7 rad). Trades a
# bounded accuracy loss (≤5e-4 rad over ±π/4) for ~3-5 KB of code that
# would otherwise pull `libm::tanf` + the soft-float scalbnf / fmaf /
# k_tanf chain. Used by the SPE firmware build to fit BTCM (Phase
# 11.3.C). Off by default — host / Linux / Zephyr / FreeRTOS / NuttX
# builds keep the libm-accurate versions.
compact-trig = []
