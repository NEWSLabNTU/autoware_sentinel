# Autoware Sentinel — SPE firmware wrap (Phase 11.5.b)
#
# `staticlib` wrap of nano-ros's `nros-board-orin-spe` rlib + a panic
# handler. NVIDIA's `rt-aux-cpu-demo-fsp/Makefile` links the resulting
# `libsentinel_spe_firmware.a` into `spe.elf` via the `ENABLE_NROS_APP`
# branch (see `scripts/spe/apply-patches.sh`).
#
# Excluded from the workspace because cargo can't unify the workspace's
# host target (`x86_64-unknown-linux-gnu`) with the SPE's
# `armv7r-none-eabi`. Build via:
#   `cd src/sentinel_spe_firmware && cargo +nightly build --release`
# or via `just build-spe-image` from the repo root, which orchestrates
# cargo + the BSP patch + the upstream Makefile.

[package]
name = "sentinel-spe-firmware"
version = "0.1.0"
edition = "2024"
description = "Autoware Sentinel SPE firmware (Cortex-R5F + NVIDIA FSP)"
license = "Apache-2.0"
publish = false

[lib]
name = "sentinel_spe_firmware"
crate-type = ["staticlib"]

[features]
# Default build is `Executor::open + spin` only — fits BTCM with ~10 KB
# headroom, exercises the IVC + zenoh-pico boot path. `just
# build-spe-image` produces a bootable `spe.bin` in this mode.
default = []
# Wire `autoware_sentinel_core::{init_island, wire_executor}` into the
# application closure. Pulls all SafetyIsland algorithm crates + msg
# codecs + 6 publishers / 3 subscribers / 1 service / 1 timer; currently
# overflows BTCM by ~37 KB. Tracked under Phase 11.3.E (DRAM mapping
# via SPE AST). To reproduce the overflow:
#   cargo +nightly build --release --features safety-island
safety-island = ["dep:autoware_sentinel_core"]

# Workspace excluded → must declare git deps locally; the workspace's
# `[patch.crates-io]` block is invisible from here. Pin matches the
# rev in the parent workspace's Cargo.toml so a future bump touches
# both files together.
[dependencies]
log = { version = "0.4", default-features = false }

# Board crate (run<F,E>, Config, println!) from nano-ros.
nros-board-orin-spe = { version = "*", default-features = false, features = ["fsp", "cortex-r"] }

# `nros-platform` is a transitive dep of the board crate; declared
# explicitly here to flip on `global-allocator` (Phase 71.27 — wires
# the FreeRTOS `pvPortMalloc` / `vPortFree` pair as Rust's
# `#[global_allocator]`). Without this, even crates that pull `alloc`
# transitively fail with "no global memory allocator found" when
# linked into a `staticlib`.
nros-platform = { version = "*", default-features = false, features = ["platform-orin-spe", "global-allocator"] }

# Phase 11.3 status:
#   [x] 11.3.A — zero-copy `nvidia-ivc/fsp` API on nano-ros side.
#   [x] 11.3.B — `Z_FEATURE_MULTI_THREAD=1` + `ZENOH_ORIN_SPE`
#       platform header. `zpico_spin_once` uses the FreeRTOS
#       condvar wait path; no `select(2)` in the SPE link.
#   [~] 11.3.C — feature pruning. nros pulled with the smallest
#       feature set that still gives `Executor` + `ExecutorConfig`:
#       `rmw-zenoh,platform-orin-spe,ros-humble`. Dropped:
#       `param-services`, `lifecycle-services`, `safety-e2e`,
#       `stream`, `unstable-zenoh-api`. Watch
#       `arm-none-eabi-size build/spe.elf` after each prune; goal
#       is .text+.data+.bss < 232 KB.
#   [ ] 11.3.D — SafetyIsland wiring in lib.rs.

# nros umbrella — `Executor` / `ExecutorConfig` / `NodeError`.
# Phase 14.1: platform/RMW features moved out of nros; the zenoh backend
# links via nros-rmw-zenoh (registered by the board entry under its
# rmw feature wiring) and the platform via nros-platform above.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "ros-humble"] }
nros-rmw-zenoh = { version = "*", default-features = false, optional = false }

# Shared sentinel core — gated `optional = true` behind the
# `safety-island` cargo feature so the default build doesn't drag the
# 11 algorithm crates / 14 msg codecs / 6 pubs / 3 subs / 1 service /
# 1 timer inline into the static linker pull. Enable via:
#   cargo +nightly build --release --features safety-island
autoware_sentinel_core = { path = "../autoware_sentinel_core", default-features = false, features = ["platform-orin-spe"], optional = true }

# `panic-halt` is the simplest correct strategy for the SPE: an
# uncaught panic blocks the FreeRTOS task forever via WFI. The MRM
# safety path is in the application closure itself, not in the
# panic handler. A future iteration may swap this for a logger that
# emits the panic location to TCU before halting.
panic-halt = "1"

# Cortex-R5F has no unwinder. Panics must abort everywhere — both this
# crate and every transitive dependency. Setting the strategy on the
# top-level profile is what makes cargo propagate it.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
opt-level = "z"      # 256 KB BTCM is tight; size before speed
codegen-units = 1
debug = false        # Strip; debug symbols inflate the rlib but are
                     # discarded by the final link anyway.

# Workspace excluded → must declare patches locally; the workspace's
# `[patch.crates-io]` block is invisible from here. Pin matches the
# rev in the parent workspace's Cargo.toml so a future bump touches
# both files together. Generated message crates re-use sentinel_linux's
# generated/ tree (single source of truth for the msg superset, same
# pattern as freertos / nuttx / zephyr siblings).
[patch.crates-io]
nros = { path = "../../../nano-ros-sentinel/packages/core/nros" }
nros-core = { path = "../../../nano-ros-sentinel/packages/core/nros-core" }
nros-serdes = { path = "../../../nano-ros-sentinel/packages/core/nros-serdes" }
nros-rmw-zenoh = { path = "../../../nano-ros-sentinel/packages/zpico/nros-rmw-zenoh" }
nros-platform = { path = "../../../nano-ros-sentinel/packages/core/nros-platform" }
nros-board-orin-spe = { path = "../../../nano-ros-sentinel/packages/boards/nros-board-orin-spe" }
zpico-sys = { path = "../../../nano-ros-sentinel/packages/zpico/zpico-sys" }

autoware_adapi_v1_msgs = { path = "../../generated/autoware_adapi_v1_msgs" }
autoware_adapi_version_msgs = { path = "../../generated/autoware_adapi_version_msgs" }
autoware_common_msgs = { path = "../../generated/autoware_common_msgs" }
autoware_control_msgs = { path = "../../generated/autoware_control_msgs" }
autoware_control_validator = { path = "../../generated/autoware_control_validator" }
autoware_internal_debug_msgs = { path = "../../generated/autoware_internal_debug_msgs" }
autoware_internal_msgs = { path = "../../generated/autoware_internal_msgs" }
autoware_operation_mode_transition_manager = { path = "../../generated/autoware_operation_mode_transition_manager" }
autoware_planning_msgs = { path = "../../generated/autoware_planning_msgs" }
autoware_system_msgs = { path = "../../generated/autoware_system_msgs" }
autoware_vehicle_cmd_gate = { path = "../../generated/autoware_vehicle_cmd_gate" }
autoware_vehicle_msgs = { path = "../../generated/autoware_vehicle_msgs" }
builtin_interfaces = { path = "../../generated/builtin_interfaces" }
diagnostic_msgs = { path = "../../generated/diagnostic_msgs" }
geographic_msgs = { path = "../../generated/geographic_msgs" }
geometry_msgs = { path = "../../generated/geometry_msgs" }
logging_demo = { path = "../../generated/logging_demo" }
nav_msgs = { path = "../../generated/nav_msgs" }
shape_msgs = { path = "../../generated/shape_msgs" }
std_msgs = { path = "../../generated/std_msgs" }
std_srvs = { path = "../../generated/std_srvs" }
tier4_control_msgs = { path = "../../generated/tier4_control_msgs" }
tier4_external_api_msgs = { path = "../../generated/tier4_external_api_msgs" }
tier4_system_msgs = { path = "../../generated/tier4_system_msgs" }
tier4_vehicle_msgs = { path = "../../generated/tier4_vehicle_msgs" }
unique_identifier_msgs = { path = "../../generated/unique_identifier_msgs" }
visualization_msgs = { path = "../../generated/visualization_msgs" }

[build-dependencies]
# Phase 14.1: compiles nros-platform-freertos C port (see build.rs).
cc = "1"
