# Autoware Sentinel — Linux Native Binary
#
# Thin platform shim around `autoware_sentinel_core`. Provides the `main`
# entry point, env_logger, and a monotonic clock. All wiring lives in core.

[package]
name = "autoware_sentinel_linux"
version = "0.1.0"
edition = "2024"
description = "Autoware Sentinel safety island — Linux native binary"
license = "Apache-2.0"
publish = false

[dependencies]
log = "0.4"
env_logger = "0.11"

# Shared core wiring. Linux dev binary enables the trajectory follower
# (controller-node) for solo planning-simulator runs; safety MCUs do not.
autoware_sentinel_core = { path = "../autoware_sentinel_core", features = ["platform-posix", "controller-node"] }

# nros — for `ExecutorConfig`, `Executor`, `SpinOptions`, `NodeError`.
nros = { version = "*", default-features = false, features = ["std", "rmw-zenoh", "platform-posix", "ros-humble", "param-services"] }

# Workaround: LLVM SIGSEGV in ARM register scavenger when compiling
# autoware_adapi_v1_msgs at opt-level=0 for thumbv7em-none-eabihf.
# Not needed for native x86, but kept for consistency with cross-check builds.
# See: https://github.com/llvm/llvm-project/issues/64277
[profile.dev.package.autoware_adapi_v1_msgs]
opt-level = 1
