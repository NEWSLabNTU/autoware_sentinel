# Autoware Sentinel — Zephyr Configuration
#
# Safety island application combining all algorithm crates into a single
# binary with nros (Zenoh) transport to the main Autoware compute.
#
# Per-board overrides (e.g. NSOS for native_sim) live in boards/<board>.conf.

# =============================================================================
# General
# =============================================================================
CONFIG_MAIN_STACK_SIZE=131072
CONFIG_HEAP_MEM_POOL_SIZE=16777216
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# libc malloc arena (Rust GlobalAlloc → malloc → this arena). Default 16 KiB
# is far too small for 51 publishers + parameter server (~96 KB executor
# arena alone) plus zenoh-pico's per-publisher write filters. 16 MiB.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16777216

# =============================================================================
# Rust Support (zephyr-lang-rust)
# =============================================================================
CONFIG_RUST=y
CONFIG_RUST_ALLOC=y

# Use printk backend for logging (not RTT)
CONFIG_LOG_BACKEND_RTT=n

# =============================================================================
# Logging
# =============================================================================
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# =============================================================================
# Networking
# =============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# Network buffers
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=16

# Network interface
CONFIG_NET_L2_ETHERNET=y

# DNS (not needed; locator is numeric)
CONFIG_DNS_RESOLVER=n

# =============================================================================
# POSIX API (required by zenoh-pico)
# =============================================================================
CONFIG_POSIX_API=y

# zenoh-pico allocates POSIX mutexes for transport and write filters.
# Zephyr defaults to 5 which is insufficient for zenoh-pico.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=32
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_MAX_PTHREAD_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16

# =============================================================================
# Timing
# =============================================================================
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# =============================================================================
# nros Module
# =============================================================================
CONFIG_NROS=y
CONFIG_NROS_RUST_API=y

# Safety island needs many pub/sub/service handles. Match the Linux .env
# values: 51 publishers, 17 services (queryables), and a 96-token liveliness
# budget. NROS_MAX_PARAMETERS / NROS_EXECUTOR_MAX_CBS / NROS_PARAM_SERVICE_BUFFER_SIZE
# are nros build-time env vars (not Kconfig); set via cargo build env.
CONFIG_NROS_MAX_PUBLISHERS=56
CONFIG_NROS_MAX_SUBSCRIBERS=16
CONFIG_NROS_MAX_QUERYABLES=32
CONFIG_NROS_MAX_LIVELINESS=96
CONFIG_NROS_SERVICE_BUFFER_SIZE=8192
