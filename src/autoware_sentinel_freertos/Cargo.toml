# Autoware Sentinel — FreeRTOS Safety Island Application
#
# Thin platform shim around `autoware_sentinel_core`. Built for
# QEMU MPS2-AN385 (Cortex-M3) + FreeRTOS + lwIP. Reaches the host's zenohd
# via QEMU user-mode networking (SLIRP), so no TAP/bridge or sudo is needed.
#
# Build: cargo build --release
# Run:   cargo run --release   (invokes qemu-system-arm via .cargo/config.toml runner)

[package]
name = "autoware_sentinel_freertos"
version = "0.1.0"
edition = "2024"
description = "Autoware Sentinel safety island — QEMU FreeRTOS binary"
license = "Apache-2.0"
publish = false

[[bin]]
name = "autoware_sentinel_freertos"
test = false
bench = false

[features]
# Default: core-only baseline (6 pubs / 3 subs / 1 service / 1 timer). The
# 13.K1.7 bisection enables comp-* features one at a time to find the
# combination that triggers the declare-storm hang.
default = []
comp-mrm = ["autoware_sentinel_core/comp-mrm"]
comp-cmd-gate-extra = ["autoware_sentinel_core/comp-cmd-gate-extra"]
comp-validator = ["autoware_sentinel_core/comp-validator"]
comp-op-mode-mgr = ["autoware_sentinel_core/comp-op-mode-mgr"]
comp-engagement = ["autoware_sentinel_core/comp-engagement"]
comp-stubs = ["autoware_sentinel_core/comp-stubs"]
comp-all = ["autoware_sentinel_core/comp-all"]

[dependencies]
log = { version = "0.4", default-features = false }
panic-semihosting = { version = "0.6", features = ["exit"] }

# Provide the GlobalAlloc impl. Sentinel pulls alloc-using paths in nros-core
# (String/Vec used internally) so we need a registered allocator. Routes
# Rust allocs through pvPortMalloc/free via nros-platform-freertos.
nros-platform = { version = "*", default-features = false, features = ["platform-freertos", "global-allocator"] }

# FreeRTOS QEMU MPS2-AN385 board crate (provides run() + Config + println!).
nros-board-mps2-an385-freertos = { version = "*" }

# Shared core wiring. Safety MCU build — no controller-node.
autoware_sentinel_core = { path = "../autoware_sentinel_core", features = ["platform-freertos"] }

# nros — for `ExecutorConfig`, `Executor`, `NodeError`. Phase 14.1: platform +
# RMW features moved out of nros; the zenoh backend links via nros-rmw-zenoh
# (registered in main) and the FreeRTOS platform via nros-platform above.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "ros-humble"] }
nros-rmw-zenoh = { version = "*", default-features = false, features = ["platform-freertos"] }

# Workaround: LLVM SIGSEGV in ARM register scavenger when compiling
# autoware_adapi_v1_msgs at opt-level=0 for thumbv7m-none-eabi.
[profile.dev.package.autoware_adapi_v1_msgs]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
debug = false
